[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-spanish"
version = "0.1.0"
description = "Small, reproducible Spanish text retrieval experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
transformers = ["torch>=2.2,<3", "transformers>=4.41,<5", "sentence-transformers>=3,<6"]
analysis = ["matplotlib>=3.7,<4", "notebook>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]
